name: fetch-open-data
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch.py
        env:
          SEC_UA: "FundaAI coverage monitor leo@funda.ai"
      - run: |
          git config user.name "open-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%TZ)"
          git push
